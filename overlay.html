const focusStats = [['Score','PUNTOS'],['Goals','GOLES'],['Shots','TIROS'],['Assists','ASIST.'],['Saves','SALVADAS']];

let focusStatsContent;

}

const sponsorPreviewStarted=performance.now();
let sponsorRotationStarted=0;
let lastSponsorRotation='';

function paintSponsor(node, sponsor, event=''){
 if(!sponsor){
  node.classList.add('hidden');
  node.sponsorKey='';
  return;
 }
 const key=JSON.stringify([sponsor.name,sponsor.logo,event]);
 if(node.sponsorKey===key) return;
 node.sponsorKey=key;
 node.classList.remove('hidden','sponsor-enter');
 node.classList.toggle('has-name',Boolean(sponsor.name));
 const image=node.querySelector('img');
 const name=node.querySelector('span');
 name.textContent=sponsor.name;
 name.classList.toggle('hidden',!sponsor.name);
 image.classList.toggle('hidden',!sponsor.logo);
 image.alt=sponsor.name?'':'Logo del patrocinador';
 if(sponsor.logo) image.src=sponsor.logo;
 else image.removeAttribute('src');
 if(event){
  node.dataset.event=event;
  node.querySelector('.sponsor-event-title').textContent=event==='overtime'?'PRORROGA':'PATROCINADO POR';
  const subtitle=node.querySelector('small');
  subtitle.textContent=event==='overtime'?'patrocinada por':'';
  subtitle.classList.toggle('hidden',event!=='overtime');
 }
 void node.offsetWidth;
 node.classList.add('sponsor-enter');
}

function renderSponsors(state, config){
 const rotation=$('sponsor-rotation'), eventPanel=$('sponsor-event');
 stage.classList.remove('overtime-sponsor-active');
 if(state.overlay_visible!==true || details || stage.classList.contains('goal-playing')){
  paintSponsor(rotation,null);
  paintSponsor(eventPanel,null);
  return;
 }
 const sponsors=config.sponsors||{};
 const hasSponsor=sponsor=>sponsor&&(sponsor.name||sponsor.logo);
 const now=performance.now();
 const overtime=state.overtime_remaining>0 &&
     (!preview || (params.get('overtime')==='1' && now-sponsorPreviewStarted<3000));
 const replay=state.goal_replay_active;
 const event=replay?'replay':(overtime?'overtime':'');
 const scoringTeam=state.goal_replay?.team??state.goal_effect?.team;
 eventPanel.style.setProperty('--sponsor-event-accent',event==='overtime'?config.colors.dark:config.colors[scoringTeam===1?'yellow':'pink']);
 const eventSponsor=event&&config['show_sponsor_'+event]!==false&&hasSponsor(sponsors[event])?sponsors[event]:null;
 stage.classList.toggle('overtime-sponsor-active',event==='overtime'&&Boolean(eventSponsor));
 paintSponsor(eventPanel,eventSponsor,event);
 const entries=Object.keys(sponsors).filter(slot=>/^rotation[1-9][0-9]*$/.test(slot)).sort((a,b)=>Number(a.slice(8))-Number(b.slice(8))).map(slot=>sponsors[slot]).filter(hasSponsor);
 if(config.show_sponsor_rotation===false||replay||overtime||!entries.length){
  paintSponsor(rotation,null);
  return;
 }
 const rotationKey=JSON.stringify([config.sponsor_interval,entries]);
 if(lastSponsorRotation!==rotationKey){
  lastSponsorRotation=rotationKey;
  sponsorRotationStarted=now;
 }
 const i=Math.floor((now-sponsorRotationStarted)/((config.sponsor_interval||8)*1000))%entries.length;
 const roster=$('players0');
 const showRoster=config.show_players && roster.offsetHeight>0;
 paintSponsor(rotation,entries[i]);
 const stageRect=stage.getBoundingClientRect(),stageScale=stageRect.width/stage.offsetWidth;
 const rect=roster.getBoundingClientRect();
 const scale=showRoster&&roster.offsetWidth?rect.width/stageScale/roster.offsetWidth:1;
 rotation.style.width=(roster.offsetWidth||(isCompactDesign(config.design)?264:285))+'px';
 rotation.style.transform='scale('+scale+')';
 const width=rotation.offsetWidth*scale,height=rotation.offsetHeight*scale;
 let left=showRoster?(rect.left-stageRect.left)/stageScale:24;
 let top=showRoster?(rect.bottom-stageRect.top)/stageScale+12:180;
 if(top+height>stage.offsetHeight-12){
  left=Math.min(left+width+12,stage.offsetWidth-width-12);
  top=Math.max(12,Math.min((rect.bottom-stageRect.top)/stageScale-height,stage.offsetHeight-height-12));
 }
 rotation.style.left=left+'px';
 rotation.style.top=top+'px';
}

function render(s){
 const minimal=isCompactDesign(s.config.design);
 stage.classList.toggle('minimal',minimal);
 stage.style.visibility=s.overlay_visible===true?'visible':'hidden';
 const c=minimal?{...s.config,colors:{pink:'#ffffff',yellow:'#a8a8a8',coral:'#525252',dark:'#101010',text:'#ffffff'}}:s.config;
 const m=s.match;for(const [key,v] of Object.entries(c.colors))stage.style.setProperty('--'+key,v);stage.style.color=c.colors.text;applyOverlayFont(c.font);for(const design of ['angular','rounded','classic','RCK'])stage.classList.toggle(design,c.design===design);stage.classList.toggle('flat',c.scoreboard_gradient===false);const observed=m.players.find(p=>p.Name===m.target),side=observed?.TeamNum===1?1:0,accent=c.colors[side===0?'pink':'yellow'];stage.style.setProperty('--observed-accent',accent);stage.style.opacity=c.opacity/100;
 for(const key of ['boost','stats','players0','players1']){const paletteKey=(key==='boost'||key==='stats')?(c.panel_colors?.[key+side]||c.panel_colors?.[key]||'dark'):(c.panel_colors?.[key]||'dark'),bg=c.colors[paletteKey]||c.colors.dark,fg=foreground(bg,c.colors.text);stage.style.setProperty('--'+key+'-bg',bg);stage.style.setProperty('--'+key+'-fg',fg);stage.style.setProperty('--'+key+'-accent',bg.toLowerCase()===c.colors.dark.toLowerCase()?accent:fg)}stage.style.setProperty('--boost-glow',accent+'33');
 $('scoreboard').style.left=c.x+'px';$('scoreboard').style.top=c.y+'px';$('scoreboard').style.transform=`scale(${c.scale/100})`;$('scoreboard').style.transformOrigin='top center';
 $('customstyle').textContent=c.custom_css||'';
 const boostCameraScale=!minimal&&c.design!=='RCK'&&c.show_players_cameras?1.1:1;
 const boostFactor=1.25*(minimal?1.05:boostCameraScale);
 for(const [id,position] of Object.entries(c.panels||{})){
  const el=$(id);
  if (!el) continue;
  const scale=position[2]/100;
  const panelFactor=id==='boost'?boostFactor:1;
  const offset=id==='boost'?145*scale*.25/2:0;
  const rckRight=c.design==='RCK'&&id==='players1';
  const rckLeft=c.design==='RCK'&&(id==='players0'||id==='focus');
  el.style.left=rckRight?'auto':(rckLeft?0:position[0]-offset)+'px';
  el.style.right=rckRight?'0px':'auto';
  el.style.top=(position[1]-offset+(c.design==='RCK'&&id==='focus'?75:0)+(['focus','boost'].includes(id)?15:0)-(c.design!=='RCK'&&['players0','players1'].includes(id)?20:0))+'px';
  el.style.bottom='auto';
  el.style.transform='scale('+(scale*panelFactor)+')';
  el.style.transformOrigin=rckRight?'top right':'top left';
 }
 const series=s.series||{slots:c.bestof%2===0?c.bestof:Math.floor(c.bestof/2)+1};

 const game = series.game ?? Math.min(c.bestof, c.teams.reduce((wins, team) => wins + team.wins, 0) + 1);
 const topText = c.event.replaceAll('[GAME]', String(game)).replaceAll('[SERIE]', String(c.bestof)).replaceAll('[Serie]', String(c.bestof));
 $('event').textContent = topText;
 $('subtitle').textContent = c.round.replaceAll('[GAME]', String(game)).replaceAll('[SERIE]', String(c.bestof)).replaceAll('[Serie]', String(c.bestof));
 for(let t=0;t<2;t++){$('name'+t).textContent=c.teams[t].name;$('score'+t).textContent=m.scores[t];const logo=$('logo'+t),logoSrc=c.teams[t].logo||'/assets/torneo.png';if(logo.getAttribute('src')!==logoSrc)logo.src=logoSrc;logo.classList.toggle('hidden',!c.show_logos);const wingLogo=$('rcklogo'+t);if(wingLogo.getAttribute('src')!==logoSrc)wingLogo.src=logoSrc;wingLogo.classList.toggle('hidden',!c.show_logos);$('series'+t).innerHTML=Array.from({length:c.bestof%2===0?c.bestof:series.slots},(_,i)=>`<i class="pip ${i<c.teams[t].wins?'on':''}"></i>`).join('');
 reconcileRoster(t,m.players.filter(p=>p.TeamNum===t).sort((a,b)=>(a.Shortcut??0)-(b.Shortcut??0)),m.target,performance.now());$('players'+t).classList.toggle('hidden',!c.show_players)}
 // Measure the actual rendered name: font, style and available space determine fit.
 for(let t=0;t<2;t++){
  const label=$('name'+t),team=c.teams[t];
  if(label.clientWidth>0 && label.scrollWidth>label.clientWidth && team.abbreviation){
   label.textContent=team.abbreviation;
  }
 }
 const activeKeys=new Set(m.players.map(playerKey));for(const key of playerCards.keys()){if(!activeKeys.has(key)){playerCards.get(key).node.remove();playerCards.delete(key)}}boostTween.retain(activeKeys);
 const sec=Math.abs(Math.floor(m.time));$('clock').textContent=(m.overtime?'+':'')+Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
 const p=observed;
 observedBoostKey=p?playerKey(p):null;
 renderStats(p, c, accent);
 $('boost').classList.toggle('hidden',!c.show_boost||!p);
 $('banner').classList.toggle('hidden',!m.banner||!c.show_events);$('banner').textContent='';$('banner').classList.add('hidden');
 if(p&&c.panels?.focus){
  const position=c.panels.focus,focus=$('focus'),scale=position[2]/100;
  focus.classList.toggle('corner-anchored',position[0]===0&&position[1]===1030);
 }
 const minimalBoostRight=stage.offsetWidth-24;
 const minimalBoostBottom=stage.offsetHeight-44;
 if(p&&c.panels?.boost){
  const position=c.panels.boost,boost=$('boost');
  if(minimal){
   const scale=position[2]/100*boostFactor;
   boost.style.left=(minimalBoostRight-boost.offsetWidth*scale)+'px';
   boost.style.top=(minimalBoostBottom-boost.offsetHeight*scale)+'px';
  }else if(position[0]===1695&&position[1]===800){
   const scale=position[2]/100*boostFactor;
   boost.style.top=(1068-boost.offsetHeight*scale)+'px';
   boost.style.left=Math.min(parseFloat(boost.style.left),1908-boost.offsetWidth*scale)+'px';
  }
 }
 renderPlayerActions(s);
 renderCameras(s, p);
 if(!minimal&&c.design!=='RCK'&&p&&c.show_boost&&c.panels?.boost){
  const cameras=[...stage.querySelectorAll('.roster .player.has-camera .player-camera')].filter(el=>!el.classList.contains('hidden')&&!el.classList.contains('preloading')&&getComputedStyle(el).visibility!=='hidden');
  if(cameras.length===6){
   const boost=$('boost'),baseScale=c.panels.boost[2]/100*1.25;
   const width=boost.offsetWidth*baseScale,height=boost.offsetHeight*baseScale;
   const left=parseFloat(boost.style.left),top=parseFloat(boost.style.top);
   const defaultBoost=c.panels.boost[0]===1695&&c.panels.boost[1]===800;
   const right=defaultBoost?1908:left+width;
   const bottom=defaultBoost?1068:top+height;
   const stageRect=stage.getBoundingClientRect(),stageScale=stageRect.width/stage.offsetWidth;
   let factor=.85*boostCameraScale;
   for(const camera of cameras){
    const rect=camera.getBoundingClientRect();
    const cameraLeft=(rect.left-stageRect.left)/stageScale,cameraRight=(rect.right-stageRect.left)/stageScale;
    const cameraBottom=(rect.bottom-stageRect.top)/stageScale;
    if(cameraRight>right-width*factor&&cameraLeft<right&&cameraBottom>bottom-height*factor&&cameraBottom<bottom){
     factor=Math.min(factor,Math.max(.01,(bottom-cameraBottom-12)/height));
    }
   }
   boost.style.transform='scale('+(baseScale*factor)+')';
   boost.style.left=(right-width*factor)+'px';
   boost.style.top=(bottom-height*factor)+'px';
  }
 }
 updateGoal(s,c);
 renderSponsors(s,c);
 const replay = s.goal_replay;
 const showReplay = s.overlay_visible === true && c.show_goal_replay !== false && !details
     && replay && !stage.classList.contains('goal-playing');
 const replayBar = $('replaybar');
 replayBar.classList.toggle('hidden', !showReplay);
 stage.classList.toggle('replay-playing', Boolean(showReplay));
 if (showReplay) {
  const color = replay.team === 0 ? c.colors.pink : replay.team === 1 ? c.colors.yellow : c.colors.text;
  replayBar.style.setProperty('--replay-accent', color);
  $('replay-scorer').textContent = replay.name || '—';
  $('replay-assister').textContent = replay.assist_name || '';
  $('replay-assist').classList.toggle('hidden', !replay.assist_name);
  $('replay-speed').textContent = replay.speed_kmh == null ? '—' : replay.speed_kmh + ' km/h';
 }
}
let lastResponse=performance.now();setInterval(()=>{if(performance.now()-lastResponse>2000)stage.style.visibility='hidden'},250);
async function poll(){try{const r=await fetch(preview ? '/preview-state?'+params.toString() : '/state',{cache:'no-store'});if(!r.ok)throw Error('state');render(await r.json());lastResponse=performance.now()}catch(e){}setTimeout(poll,100)}poll();
